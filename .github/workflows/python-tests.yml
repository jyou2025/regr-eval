name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python_version }} / ${{ matrix.numpy_spec }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - python_version: "3.9"
            numpy_spec: "numpy==1.20.3"

          - python_version: "3.10"
            numpy_spec: "numpy==1.21.6"

          - python_version: "3.11"
            numpy_spec: "numpy==1.23.5"

          - python_version: "3.12"
            numpy_spec: "numpy==1.26.4"

          - python_version: "3.13"
            numpy_spec: "numpy"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}
          cache: pip

      - name: Install NumPy
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ matrix.numpy_spec }}"

      - name: Install regreval
        run: python -m pip install --no-deps -e ./python

      - name: Show versions
        run: |
          python --version
          python -c "import numpy; print('NumPy', numpy.__version__)"

      - name: Run tests
        run: python -m unittest discover -s python/tests -v
