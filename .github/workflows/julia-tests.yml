name: Julia tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Julia ${{ matrix.julia_version }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        julia_version:
          - "1.10"
          - "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia_version }}
          arch: x64

      - name: Show Julia version
        run: julia -e 'using InteractiveUtils; versioninfo()'

      - name: Instantiate project
        run: julia --project=julia -e 'using Pkg; Pkg.instantiate()'

      - name: Run tests
        run: julia --project=julia -e 'using Pkg; Pkg.test()'
